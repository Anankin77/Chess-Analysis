<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --text: #f3e9d8; --muted: #b9a888; --ok: #81b64c; --bad: #e0564a; --gold: #d9a441; --panel: rgba(24,15,8,.6); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: "Source Sans Pro", system-ui, sans-serif; color: var(--text); background: transparent; }
  #wrap { max-width: 520px; padding: 0 10px 10px 0; }
  #frame { padding: 12px; border-radius: 10px; background: linear-gradient(145deg, #4a2d18, #1f120a 70%);
           border: 1px solid rgba(217,164,65,.45); transition: box-shadow .35s;
           box-shadow: inset 0 2px 0 rgba(255,220,160,.18), inset 0 -3px 6px rgba(0,0,0,.6), 0 8px 18px rgba(0,0,0,.5); }
  #frame.ok { box-shadow: 0 0 0 3px #81b64c, 0 0 28px rgba(129,182,76,.75), 0 8px 18px rgba(0,0,0,.5); }
  #frame.bad { box-shadow: 0 0 0 3px #d93a3a, 0 0 28px rgba(217,58,58,.7), 0 8px 18px rgba(0,0,0,.5); animation: shake .35s; }
  @keyframes shake { 20% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 80% { transform: translateX(-3px); } }
  #board { position: relative; width: 100%; aspect-ratio: 1; display: grid; grid-template-columns: repeat(8, 1fr);
           grid-template-rows: repeat(8, 1fr); border-radius: 4px; overflow: hidden; user-select: none;
           -webkit-user-select: none; touch-action: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.5); }
  #grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .55; z-index: 1; }
  .sq { position: relative; }
  .sq.light { background: #e8cfa6; } .sq.dark { background: #a5713f; }
  .sq.sel { box-shadow: inset 0 0 0 4px rgba(217,164,65,.95); }
  .sq.last { background-image: linear-gradient(rgba(190,200,40,.45), rgba(190,200,40,.45)); }
  .sq.target::after { content: ""; position: absolute; left: 36%; top: 36%; width: 28%; height: 28%; border-radius: 50%;
                      background: rgba(30,20,10,.38); pointer-events: none; z-index: 3; }
  .sq.target.occ::after { left: 4%; top: 4%; width: 92%; height: 92%; background: none; border: 5px solid rgba(30,20,10,.4); }
  .sq svg { width: 100%; height: 100%; display: block; pointer-events: none; position: relative; z-index: 2;
            filter: drop-shadow(0 3px 2px rgba(0,0,0,.45)); transition: transform .12s; }
  .sq.mine { cursor: grab; }
  @media (hover: hover) { .sq.mine:hover svg { transform: translateY(-5%) scale(1.07); } }
  .sq.sel svg { transform: translateY(-7%) scale(1.1); }
  .sq.drop svg { animation: drop .22s ease-out; }
  @keyframes drop { from { transform: translateY(-18%) scale(1.15); } to { transform: none; } }
  .coord { position: absolute; font-size: 10px; font-weight: 700; opacity: .9; pointer-events: none; z-index: 2; }
  .coord.file { right: 3px; bottom: 1px; } .coord.rank { left: 3px; top: 1px; }
  .light .coord { color: #a5713f; } .dark .coord { color: #e8cfa6; }
  #arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
  #ghost { position: fixed; pointer-events: none; display: none; z-index: 10; }
  #ghost svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 4px rgba(0,0,0,.5)); }
  #promo { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; gap: 8px; z-index: 6; }
  #promo button { width: 20%; aspect-ratio: 1; border: 0; border-radius: 8px; background: #e8cfa6; cursor: pointer; padding: 2px; }
  #promo button svg { width: 100%; height: 100%; }
  #status { margin: 10px 0 6px; font-size: 16px; font-weight: 700; min-height: 24px; }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }

  #reveal { display: none; }
  #nav { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  #nav button { min-width: 46px; height: 44px; border-radius: 8px; border: 1px solid rgba(0,0,0,.4); font-size: 18px;
                font-weight: 800; color: var(--text); background: linear-gradient(180deg, #6b4728, #4c3019);
                box-shadow: 0 3px 0 #2a190d; cursor: pointer; }
  #nav button:active { transform: translateY(2px); box-shadow: 0 1px 0 #2a190d; }
  #nav button:disabled { opacity: .4; cursor: default; }
  #moves { font-size: 14px; line-height: 1.5; padding: 4px 8px; border-radius: 8px;
           background: var(--panel); border: 1px solid rgba(217,164,65,.2); max-height: 68px; overflow-y: auto; }
  #moves span { padding: 1px 3px; border-radius: 4px; cursor: pointer; white-space: nowrap; display: inline-block; }
  #moves span.cur { background: var(--gold); color: #24160c; font-weight: 700; }
  #lines { background: var(--panel); border: 1px solid rgba(217,164,65,.2); border-radius: 8px; overflow: hidden; }
  .row { display: flex; gap: 8px; align-items: center; padding: 9px 10px; cursor: pointer; font-size: 14px;
         border-left: 4px solid transparent; }
  .row + .row { border-top: 1px solid rgba(217,164,65,.14); }
  .row.cur { background: rgba(217,164,65,.16); border-left-color: var(--gold); }
  .row .mv { font-weight: 800; min-width: 58px; }
  .row .win { min-width: 50px; font-variant-numeric: tabular-nums; }
  .row .tag { font-size: 12px; padding: 1px 7px; border-radius: 9px; color: #fff; white-space: nowrap; }
  .tag.ok { background: #5d8a34; } .tag.bad { background: #b23a30; } .tag.you { background: #7a5a2a; }
  .row .hint { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  #evalbar { display: none; position: relative; height: 16px; margin-top: 8px; border-radius: 8px; overflow: hidden;
             background: #2a1b10; border: 1px solid rgba(217,164,65,.3); }
  #evalfill { height: 100%; width: 50%; background: linear-gradient(90deg, #5d8a34, #81b64c); transition: width .25s; }
  #evaltxt { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 15px; font-weight: 700; }
  #comment { display: none; background: var(--panel); border: 1px solid rgba(217,164,65,.2); border-radius: 8px;
             padding: 4px 12px; font-size: 15px; line-height: 1.5; }
  #comment p { margin: 8px 0; }
  #subbtns { display: none; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  #subbtns button { flex: 1 1 150px; min-height: 44px; border-radius: 8px; border: 1px solid rgba(0,0,0,.4); font-size: 14px;
                    font-weight: 700; color: var(--text); background: linear-gradient(180deg, #6b4728, #4c3019);
                    box-shadow: 0 3px 0 #2a190d; cursor: pointer; }
  #subbtns button.go { background: linear-gradient(180deg, #95c95b, #6fa53c); box-shadow: 0 3px 0 #45691f; color: #fff; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 9px; color: #fff; margin-left: 8px; vertical-align: middle; white-space: nowrap; }
  .g-Best, .g-Good { background: #5d8a34; } .g-Inaccuracy { background: #b58a1e; } .g-Mistake { background: #c9692a; }
  .g-Blunder { background: #b23a30; } .g-Book { background: #6b5a45; } .g-Opponent { background: #3f6f8f; }
  #moves span.m-Inaccuracy { color: #f0c24a; } #moves span.m-Mistake { color: #f08a4a; } #moves span.m-Blunder { color: #ff7a6e; }
  #moves span.cur { color: #24160c !important; }
  body.game #lines { display: none; } body.game #comment, body.game #evalbar { display: block; } body.game #subbtns { display: flex; }
  body.game #moves { max-height: 92px; }
  body:not(.game) #last, body:not(.game) #key { display: none; }
  @media (min-width: 760px) {                      /* laptop: board left, review right */
    body.game #wrap { max-width: none; display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr);
                      column-gap: 20px; align-items: start; }
    body.game #frame, body.game #evalbar, body.game #status { grid-column: 1; }
    body.game #reveal { grid-column: 2; grid-row: 1 / span 3; }
    body.game #moves { max-height: 132px; }
    body.game #comment { font-size: 16px; }
  }
  @media (max-width: 420px) {
    #wrap { padding-right: 0; } #frame { padding: 6px; border-radius: 8px; }
    .row .hint { display: none; } .coord { font-size: 8px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="frame"><div id="board"><div id="grain"></div><svg id="arrows" viewBox="0 0 8 8"></svg><div id="promo"></div></div></div>
  <div id="evalbar"><div id="evalfill"></div><span id="evaltxt"></span></div>
  <div id="status"></div>
  <div id="reveal">
    <div id="nav">
      <button id="first" title="Back to the position">⏮</button>
      <button id="prev" title="Previous move (←)">◀</button>
      <button id="next" title="Next move (→)">▶</button>
      <button id="last" title="End of the game">⏭</button>
      <button id="key" title="Next key moment">⚠</button>
    </div>
    <div id="movesrow" style="margin-bottom:8px"><div id="moves"></div></div>
    <div id="subbtns"></div>
    <div id="comment"></div>
    <div id="lines"></div>
  </div>
</div>
<div id="ghost"></div>
<script>
// Minimal Streamlit component protocol (no build step, no CDN).
const send = (type, data) => window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, data || {}), "*");
const setHeight = () => send("streamlit:setFrameHeight", {height: document.getElementById("wrap").offsetHeight + 8});
const setValue = (value) => send("streamlit:setComponentValue", {value, dataType: "json"});

const FILES = "abcdefgh";
const $ = (id) => document.getElementById(id);
const boardEl = $("board"), arrowsEl = $("arrows"), statusEl = $("status"), revealEl = $("reveal"),
      promoEl = $("promo"), ghostEl = $("ghost"), grainEl = $("grain"), frameEl = $("frame"),
      linesEl = $("lines"), movesEl = $("moves");

// Wood grain over the squares: stretched fractal noise, generated in the browser.
grainEl.style.backgroundImage = "url('data:image/svg+xml;base64," + btoa(
  "<svg xmlns='http://www.w3.org/2000/svg' width='480' height='480'><filter id='g' x='0' y='0' width='100%' height='100%'>" +
  "<feTurbulence type='fractalNoise' baseFrequency='0.006 0.16' numOctaves='4' seed='5' stitchTiles='stitch'/>" +
  "<feColorMatrix values='0 0 0 0 .35  0 0 0 0 .2  0 0 0 0 .08  1.7 0 0 0 -.55'/></filter>" +
  "<rect width='100%' height='100%' filter='url(#g)'/></svg>") + "')";

let A = null;                 // args from Python
let puzzleId = null;
let pos = {};                 // square -> piece letter (what is on screen)
let selected = null, answered = false, lastMove = null, drag = null;
let answerUci = null;         // the move I tried
let viewLine = 0, viewPly = 0; // replay cursor after the reveal (ply 0 = the puzzle position)

const svgPiece = (p) => `<svg viewBox="0 0 45 45">${A.pieces[p]}</svg>`;
const isMine = (p) => p && ((A.orientation === "white") === (p === p.toUpperCase()));
const allLines = () => A.lines.concat([A.played]);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));

function parseFen(fen) {
  const out = {}, rows = fen.split(" ")[0].split("/");
  rows.forEach((row, r) => {
    let f = 0;
    for (const ch of row) { if (/\d/.test(ch)) f += +ch; else { out[FILES[f] + (8 - r)] = ch; f++; } }
  });
  return out;
}

function squares() {          // display order, top-left first
  const list = [];
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const file = A.orientation === "white" ? f : 7 - f, rank = A.orientation === "white" ? 8 - r : r + 1;
    list.push(FILES[file] + rank);
  }
  return list;
}

function xy(sq) {             // centre of a square in board units (0..8)
  const f = FILES.indexOf(sq[0]), r = +sq[1];
  return A.orientation === "white" ? [f + .5, 8 - r + .5] : [7 - f + .5, r - .5];
}

function draw() {
  boardEl.querySelectorAll(".sq").forEach((e) => e.remove());
  const targets = selected && !answered ? A.legal.filter((m) => m.uci.startsWith(selected)).map((m) => m.uci.slice(2, 4)) : [];
  squares().forEach((sq, i) => {
    const el = document.createElement("div");
    const dark = (FILES.indexOf(sq[0]) + +sq[1]) % 2 === 1;
    el.className = "sq " + (dark ? "dark" : "light");
    el.dataset.sq = sq;
    if (sq === selected) el.classList.add("sel");
    if (!answered && isMine(pos[sq])) el.classList.add("mine");
    if (lastMove && (sq === lastMove.slice(0, 2) || sq === lastMove.slice(2, 4))) el.classList.add("last");
    if (lastMove && sq === lastMove.slice(2, 4)) el.classList.add("drop");
    if (targets.includes(sq)) el.classList.add("target", ...(pos[sq] ? ["occ"] : []));
    let html = pos[sq] && !(drag && drag.moved && drag.from === sq) ? svgPiece(pos[sq]) : "";
    if (i % 8 === 0) html += `<span class="coord rank">${sq[1]}</span>`;
    if (i >= 56) html += `<span class="coord file">${sq[0]}</span>`;
    el.innerHTML = html;
    boardEl.insertBefore(el, grainEl);
  });
}

function arrow(uci, color, width) {
  const [x1, y1] = xy(uci.slice(0, 2)), [x2, y2] = xy(uci.slice(2, 4));
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
  const head = .34, ex = x2 - ux * head, ey = y2 - uy * head, px = -uy * head * .55, py = ux * head * .55;
  return `<g opacity=".85"><line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="${color}" stroke-width="${width}" stroke-linecap="round"/>` +
         `<polygon points="${x2},${y2} ${ex + px},${ey + py} ${ex - px},${ey - py}" fill="${color}"/></g>`;
}

function applyMove(uci) {     // only used for the single move I make on the puzzle position
  const from = uci.slice(0, 2), to = uci.slice(2, 4), piece = pos[from];
  if (piece.toLowerCase() === "p" && from[0] !== to[0] && !pos[to]) delete pos[to[0] + from[1]];   // en passant
  if (piece.toLowerCase() === "k" && Math.abs(FILES.indexOf(from[0]) - FILES.indexOf(to[0])) === 2) { // castling
    const kingSide = to[0] === "g", rf = (kingSide ? "h" : "a") + from[1], rt = (kingSide ? "f" : "d") + from[1];
    pos[rt] = pos[rf]; delete pos[rf];
  }
  delete pos[from];
  pos[to] = uci.length > 4 ? (piece === "P" ? uci[4].toUpperCase() : uci[4]) : piece;
  lastMove = uci;
}

// ---- reveal + replay -------------------------------------------------------------------
function show() {             // paint the replay cursor
  const line = allLines()[viewLine];
  viewPly = Math.max(0, Math.min(viewPly, line.fens.length));
  if (viewPly === 0) {
    pos = parseFen(A.fen); lastMove = null;
    let arrows = arrow(A.played.uci, "#d93a3a", .13);
    A.lines.filter((l) => l.ok).forEach((l, i) => { arrows += arrow(l.uci, "#81b64c", i === 0 ? .2 : .13); });
    arrowsEl.innerHTML = arrows;
  } else {
    pos = parseFen(line.fens[viewPly - 1]); lastMove = line.ucis[viewPly - 1];
    arrowsEl.innerHTML = "";
  }
  draw();
  linesEl.innerHTML = allLines().map((l, i) => {
    const mine = i === A.lines.length;
    const tag = mine ? '<span class="tag you">played in the game</span>'
                     : `<span class="tag ${l.ok ? "ok" : "bad"}">${l.ok ? "accepted" : "too weak"}</span>`;
    return `<div class="row${i === viewLine ? " cur" : ""}" data-i="${i}"><span class="mv">${esc(l.san)}</span>` +
           `<span class="win">${l.win}%</span>${tag}<span class="hint">${i === viewLine ? "use ◀ ▶" : "tap to replay"}</span></div>`;
  }).join("");
  movesEl.innerHTML = line.sans.map((s, i) => `<span data-p="${i + 1}" class="${i + 1 === viewPly ? "cur" : ""}">${esc(s)}</span>`).join(" ");
  const cur = movesEl.querySelector(".cur"); if (cur) cur.scrollIntoView({block: "nearest"});
  $("first").disabled = $("prev").disabled = viewPly === 0;
  $("next").disabled = viewPly >= line.fens.length;
  setHeight();
}

function reveal() {
  answered = true; selected = null;
  revealEl.style.display = "block";
  if (answerUci !== null) {
    const correct = A.accepted.includes(answerUci);
    const san = (A.legal.find((m) => m.uci === answerUci) || {}).san || answerUci;
    const known = A.lines.find((l) => l.uci === answerUci) || (A.played.uci === answerUci ? A.played : null);
    statusEl.className = correct ? "ok" : "bad";
    statusEl.textContent = correct ? `Correct: ${san}` :
      `Not this time: ${san}` + (known ? ` (${known.win}%)` : " is outside the engine's top moves");
    frameEl.className = correct ? "ok" : "bad";
    // After a miss, open on the game move so the refutation is one tap away.
    viewLine = correct ? Math.max(0, A.lines.findIndex((l) => l.uci === answerUci)) : A.lines.length;
  } else {
    statusEl.className = ""; statusEl.textContent = A.prompt || "";
    viewLine = A.lines.length;
  }
  viewPly = 0;
  show();
}

// ---- whole-game walkthrough (mode "game") ------------------------------------------------
let gi = -1, sub = null;       // current game ply (-1 = start); sub = {line, ply, title} while inside a side line
const isGame = () => A && A.mode === "game";
const md = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

function gameShow() {
  const P = A.plies;
  gi = Math.max(-1, Math.min(gi, P.length - 1));
  const cur = gi >= 0 ? P[gi] : null;
  let fen = A.fen, last = null, arrows = "";
  if (sub) { sub.ply = Math.max(1, Math.min(sub.ply, sub.line.fens.length)); fen = sub.line.fens[sub.ply - 1]; last = sub.line.ucis[sub.ply - 1]; }
  else if (cur) { fen = cur.fen; last = cur.uci; if (cur.best && cur.best.uci !== cur.uci) arrows = arrow(cur.best.uci, "#81b64c", .16); }
  pos = parseFen(fen); lastMove = last; arrowsEl.innerHTML = arrows; draw();

  statusEl.className = "";
  if (sub) statusEl.innerHTML = esc(sub.title);
  else if (!cur) statusEl.textContent = "Start position";
  else statusEl.innerHTML = esc(cur.label) + (cur.grade ? `<span class="chip g-${cur.grade.split(" ")[0]}">${esc(cur.grade)}</span>` : "");

  $("comment").innerHTML = sub ? `<p>${md(sub.note)}</p>` : cur ? cur.text.map((t) => `<p>${md(t)}</p>`).join("") : `<p>${md(A.intro || "")}</p>`;
  $("subbtns").innerHTML = sub ? '<button data-a="back">↩ Back to the game</button>' :
    (cur && cur.best ? `<button class="go" data-a="best">▶ Play the better ${esc(cur.best.san)}</button>` : "") +
    (cur && cur.cont ? '<button data-a="cont">▶ What the engine expects next</button>' : "");

  if (sub) movesEl.innerHTML = sub.line.sans.map((s, i) => `<span data-p="${i + 1}" class="${i + 1 === sub.ply ? "cur" : ""}">${esc(s)}</span>`).join(" ");
  else movesEl.innerHTML = P.map((m, i) => `<span data-p="${i}" class="${i === gi ? "cur " : ""}${m.who === "me" ? "m-" + m.grade : ""}">${esc(m.short)}</span>`).join(" ");
  const c = movesEl.querySelector(".cur"); if (c) movesEl.scrollTop = Math.max(0, c.offsetTop - movesEl.offsetTop - 30);

  const ev = cur && cur.eval !== null && cur.eval !== undefined ? cur.eval : null;
  $("evalfill").style.width = (ev === null ? 50 : ev) + "%";
  $("evaltxt").textContent = ev === null ? "" : `your winning chances ${Math.round(ev)}%`;
  $("first").disabled = $("prev").disabled = sub ? sub.ply <= 1 : gi < 0;
  $("next").disabled = sub ? sub.ply >= sub.line.fens.length : gi >= P.length - 1;
  $("last").disabled = !!sub || gi >= P.length - 1;
  $("key").disabled = !!sub || !P.some((m) => m.key);
  setHeight();
}

$("subbtns").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const cur = A.plies[gi];
  if (b.dataset.a === "back") sub = null;
  else if (b.dataset.a === "best") sub = {line: cur.best, ply: 1, title: `Better line instead of ${cur.label}`,
                                          note: "This is the line the engine prefers. Step through it with **◀ ▶**."};
  else sub = {line: cur.cont, ply: 1, title: `Engine line after ${cur.label}`,
              note: "Best play for both sides after the move played in the game. Step with **◀ ▶**."};
  gameShow();
};
$("last").onclick = () => { gi = A.plies.length - 1; gameShow(); };
$("key").onclick = () => {
  const P = A.plies; let i = P.findIndex((m, k) => k > gi && m.key);
  if (i < 0) i = P.findIndex((m) => m.key);
  if (i >= 0) { gi = i; gameShow(); }
};

function step(delta) {
  if (isGame()) { if (sub) sub.ply += delta; else gi += delta; gameShow(); }
  else if (answered) { viewPly += delta; show(); }
}
$("first").onclick = () => { if (isGame()) { if (sub) sub.ply = 1; else gi = -1; gameShow(); } else { viewPly = 0; show(); } };
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
linesEl.onclick = (e) => { const r = e.target.closest(".row"); if (r) { viewLine = +r.dataset.i; viewPly = 1; show(); } };
movesEl.onclick = (e) => {
  const s = e.target.closest("span"); if (!s) return;
  if (isGame()) { if (sub) sub.ply = +s.dataset.p; else gi = +s.dataset.p; gameShow(); }
  else { viewPly = +s.dataset.p; show(); }
};
document.addEventListener("keydown", (e) => {
  if (!answered) return;
  if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
  if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
});

// ---- answering -------------------------------------------------------------------------
function tryMove(from, to) {
  const cands = A.legal.filter((m) => m.uci.slice(0, 4) === from + to);
  if (!cands.length) return false;
  if (cands.length === 1) { commit(cands[0].uci); return true; }
  const white = pos[from] === "P";                       // promotion: let the player choose
  promoEl.innerHTML = "";
  for (const p of "qrbn") {
    const b = document.createElement("button");
    b.innerHTML = svgPiece(white ? p.toUpperCase() : p);
    b.onclick = () => { promoEl.style.display = "none"; commit(from + to + p); };
    promoEl.appendChild(b);
  }
  promoEl.style.display = "flex";
  return true;
}

function commit(uci) {
  if (answered) return;
  answerUci = uci;
  applyMove(uci); answered = true; selected = null; draw();   // show my move landing...
  const correct = A.accepted.includes(uci);
  frameEl.className = correct ? "ok" : "bad";
  setTimeout(reveal, 650);                                     // ...then the solution
  // One message to Python so the grade buttons can appear; the check itself ran here, client side.
  setValue({puzzle: puzzleId, uci, correct});
}

function squareAt(x, y) {
  const el = document.elementFromPoint(x, y);
  const sq = el && el.closest ? el.closest(".sq") : null;
  return sq ? sq.dataset.sq : null;
}

boardEl.addEventListener("pointerdown", (e) => {
  if (answered || !A || promoEl.style.display === "flex") return;
  const sq = squareAt(e.clientX, e.clientY);
  if (!sq) return;
  if (selected && sq !== selected && tryMove(selected, sq)) return;
  if (isMine(pos[sq])) {
    selected = sq;
    drag = {from: sq, moved: false, x: e.clientX, y: e.clientY};
    try { boardEl.setPointerCapture(e.pointerId); } catch (err) {}
  } else selected = null;
  draw();
});

boardEl.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const size = boardEl.clientWidth / 8;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {
    drag.moved = true;
    ghostEl.style.width = ghostEl.style.height = size * 1.25 + "px";   // a bit larger, visible under a finger
    ghostEl.innerHTML = svgPiece(pos[drag.from]);
    ghostEl.style.display = "block";
    draw();
  }
  if (drag.moved) {
    const lift = e.pointerType === "touch" ? size * .9 : 0;
    ghostEl.style.left = e.clientX - size * .625 + "px"; ghostEl.style.top = e.clientY - size * .625 - lift + "px";
  }
});

function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  ghostEl.style.display = "none";
  if (d.moved) {
    const sq = squareAt(e.clientX, e.clientY);
    if (!(sq && sq !== d.from && tryMove(d.from, sq))) draw();
  }
}
boardEl.addEventListener("pointerup", endDrag);
boardEl.addEventListener("pointercancel", endDrag);

function applyTheme(theme) {
  if (!theme) return;
  if (theme.textColor) document.documentElement.style.setProperty("--text", theme.textColor);
  if (theme.font) document.body.style.fontFamily = theme.font;
}

window.addEventListener("message", (e) => {
  if (!e.data || e.data.type !== "streamlit:render") return;
  applyTheme(e.data.theme);
  const args = e.data.args;
  if (args.puzzle_id !== puzzleId) {                     // new puzzle: reset client state
    A = args; puzzleId = args.puzzle_id;
    pos = parseFen(A.fen);
    selected = null; answered = false; lastMove = null; drag = null; answerUci = null; viewLine = 0; viewPly = 0;
    arrowsEl.innerHTML = ""; revealEl.style.display = "none"; promoEl.style.display = "none";
    statusEl.className = ""; frameEl.className = "";
    statusEl.textContent = (A.orientation === "white" ? "White" : "Black") + " to move. " + (A.prompt || "");
    document.body.classList.toggle("game", A.mode === "game");
    draw();
    if (A.mode === "game") {                             // whole-game walkthrough: no question at all
      answered = true; gi = (A.start === undefined ? -1 : A.start); sub = null;
      revealEl.style.display = "block";
      gameShow();
    }
    if (A.mode === "view") reveal();                     // browsing a leak: no question, straight to replay
  }
  setHeight();
});
window.addEventListener("resize", setHeight);
send("streamlit:componentReady", {apiVersion: 1});
</script>
</body>
</html>
